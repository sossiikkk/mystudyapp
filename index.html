<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Моя учёба</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#28233c;background:#f6f4ff}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #6954da;outline-offset:2px}.app{max-width:720px;margin:auto;padding:24px 16px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{color:#796d9d;font-size:13px}h1{font-size:28px;margin:3px 0 12px}h2{font-size:18px;margin:0 0 12px}p{line-height:1.45}.muted{color:#77718d;font-size:13px}.card{background:white;border:1px solid #edeaf7;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 5px 20px #2a1b6508}.btn{background:#7663df;color:white;border:0;border-radius:11px;padding:10px 13px;font-weight:650}.btn.secondary{background:#efebff;color:#5e4ac6}.btn.danger{background:#ffe8eb;color:#b72e4a}.btn.small{padding:7px 10px;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:12px}.item{padding:12px 0;border-top:1px solid #efedf6}.item:first-child{border-top:0}.item.done{opacity:.55}.item.done .task-name{text-decoration:line-through}.pill{display:inline-block;border-radius:9px;background:#eeeaff;color:#6550c6;padding:5px 9px;font-size:12px}.empty{color:#89839d;text-align:center;padding:20px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:white;box-shadow:0 -4px 18px #23174a12;padding:10px 6px max(12px,env(safe-area-inset-bottom));z-index:2}.nav-inner{display:flex;justify-content:space-around;width:100%;max-width:720px}.nav button{border:0;background:transparent;color:#827a9a;font-size:12px;padding:7px}.nav button.active{color:#6550d3;font-weight:800}.nav .emoji{display:block;font-size:21px;margin-bottom:3px}.modal{position:fixed;inset:0;background:#17112a99;display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}.modal[hidden]{display:none}.dialog{width:min(100%,480px);max-height:90vh;overflow:auto;background:white;border-radius:19px;padding:20px}label{display:grid;gap:6px;color:#625b77;font-size:13px}input:not([type=checkbox]),select,textarea{width:100%;padding:11px;border:1px solid #dcd7ee;border-radius:10px;background:white;color:#28233c}textarea{min-height:80px;resize:vertical}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{min-height:44px;border:0;border-radius:10px;background:#f5f2fc;position:relative;color:#29233e}.day.active{background:#7663df;color:white}.dot{position:absolute;bottom:3px;left:calc(50% - 3px);width:6px;height:6px;background:#e86d91;border-radius:50%}.week{text-align:center;color:#8b829e;font-size:12px;padding:8px 0}.notice{background:#fff4da;border-radius:10px;padding:10px;font-size:13px;color:#795700}.danger-text{color:#b72e4a}.checkbox{width:19px;height:19px;accent-color:#7663df;flex-shrink:0}.grow{flex:1;min-width:0}.nowrap{white-space:nowrap}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.hint{font-size:12px;color:#8a849c}

/* Two user-selectable pink themes. Default is light. */
:root{--bg:#fff5f9;--text:#332331;--muted:#866c7b;--card:#ffffff;--line:#f4dce8;--accent:#df5d99;--accent-text:#ffffff;--soft:#ffe6f0;--soft-text:#a72d68;--input:#ffffff;--day:#fff0f6;--shadow:#9e37640c;--overlay:#27121d99;--warning-bg:#fff1d8;--warning-text:#765300;--danger-bg:#ffe1e8;--danger-text:#b62d55;--focus:#df5d99}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141016;--text:#fff0f7;--muted:#c4a9ba;--card:#241b26;--line:#493447;--accent:#ff75b4;--accent-text:#23101c;--soft:#48283c;--soft-text:#ffabd0;--input:#2d2230;--day:#382739;--shadow:#00000035;--overlay:#000000bb;--warning-bg:#453321;--warning-text:#ffe0a2;--danger-bg:#492535;--danger-text:#ffabc2;--focus:#ff75b4}
html,body{background:var(--bg);color:var(--text)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline-color:var(--focus)}
.eyebrow,.muted,.hint,.week,.empty{color:var(--muted)}
.card{background:var(--card);border-color:var(--line);box-shadow:0 5px 20px var(--shadow)}
.btn{background:var(--accent);color:var(--accent-text)}
.btn.secondary{background:var(--soft);color:var(--soft-text)}
.btn.danger{background:var(--danger-bg);color:var(--danger-text)}
.item{border-top-color:var(--line)}.pill{background:var(--soft);color:var(--soft-text)}
.nav{background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 18px var(--shadow)}
.nav button{color:var(--muted)}.nav button.active{color:var(--accent)}
.modal{background:var(--overlay)}.dialog{background:var(--card);color:var(--text)}
label{color:var(--muted)}
input:not([type=checkbox]),select,textarea{background:var(--input);border-color:var(--line);color:var(--text)}
.day{background:var(--day);color:var(--text)}.day.active{background:var(--accent);color:var(--accent-text)}
.dot{background:var(--accent)}.checkbox{accent-color:var(--accent)}
.notice{background:var(--warning-bg);color:var(--warning-text)}.danger-text{color:var(--danger-text)}
.theme-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.theme-choice{display:flex;flex-direction:column;align-items:flex-start;gap:8px;border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:12px;text-align:left;min-height:112px}
.theme-choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft)}
.theme-choice .preview{display:flex;gap:4px}.theme-choice .swatch{width:19px;height:19px;border-radius:6px;border:1px solid #8884}
.theme-choice small{color:var(--muted)}
</style></head><body><main class="app" id="screen"></main><nav class="nav"><div class="nav-inner" id="nav"></div></nav><div class="modal" id="modal" hidden></div><script src="https://telegram.org/js/telegram-web-app.js"></script><script>
'use strict';
(()=>{
const KEY='my-study-planner-v2';
const THEME_KEY='my-study-planner-theme-v1';
const CLOUD_URL_KEY='my-study-planner-function-url';
let theme='light';
try{theme=localStorage.getItem(THEME_KEY)==='dark'?'dark':'light';}catch(e){}
function applyTheme(){document.documentElement.setAttribute('data-theme',theme);}
function setTheme(next){if(next!=='light'&&next!=='dark')return;theme=next;applyTheme();try{localStorage.setItem(THEME_KEY,theme);}catch(e){console.warn('Не удалось сохранить тему',e);}render();}
applyTheme();
const empty=()=>({semester:'Семестр 1',subjects:[],tasks:[],grades:[],archives:[]});
const clone=x=>JSON.parse(JSON.stringify(x));
const id=()=>('id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2));
const $=s=>document.querySelector(s);
const escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const prettyDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):'Без даты';
const valid=x=>x&&typeof x.semester==='string'&&['subjects','tasks','grades','archives'].every(k=>Array.isArray(x[k]));
let db=empty(),tab='subjects',currentSubject=null,month=new Date(),selected=today(),storageOK=true;
let cloudMode=Boolean(window.Telegram?.WebApp?.initData), cloudReady=false, cloudBusy=false, cloudError='', cloudUrl='';
try { cloudUrl=localStorage.getItem(CLOUD_URL_KEY)||''; } catch(e) {}
const telegramData=()=>window.Telegram?.WebApp?.initData||'';
const uuid=()=>crypto.randomUUID();
function normalizeURL(value){const v=value.trim().replace(/\/+$/,'');if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/functions\/v1\/study-api$/i.test(v))throw Error('Введи полный адрес функции вида https://PROJECT.supabase.co/functions/v1/study-api');return v;}
async function api(action,extra={}){
 if(!cloudUrl)throw Error('Сначала укажи адрес функции Supabase в настройках');
 if(!telegramData())throw Error('Открой приложение через кнопку своего Telegram-бота');
 const response=await fetch(cloudUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:telegramData(),action,...extra})});
 let data;try{data=await response.json()}catch{throw Error('Сервер вернул некорректный ответ')}
 if(!response.ok)throw Error((data?.error||'Ошибка сервера')+' (HTTP '+response.status+')');
 return data;
}
async function loadCloud(){
 cloudBusy=true;cloudError='';render();
 try{
  let raw=await api('load');
  if(!raw.semesters.length){await api('save',{table:'semesters',record:{id:uuid(),name:'Семестр 1'}});raw=await api('load');}
  const semesters=raw.semesters;
  const current=semesters[semesters.length-1];
  const pack=sem=>{const subjects=raw.subjects.filter(s=>s.semester_id===sem.id).map(s=>({id:s.id,name:s.name}));const ids=new Set(subjects.map(s=>s.id));return {semester:sem.name,subjects,tasks:raw.tasks.filter(t=>ids.has(t.subject_id)).map(t=>({id:t.id,sid:t.subject_id,name:t.name,due:t.due_date,description:t.description||'',done:!!t.completed})),grades:raw.grades.filter(g=>ids.has(g.subject_id)).map(g=>({id:g.id,sid:g.subject_id,name:g.name,points:Number(g.points)}))};};
  const active=pack(current);
  db={...active,archives:semesters.filter(s=>s.id!==current.id).map(pack)};
  window.__semesterId=current.id;
  cloudReady=true;
 }catch(e){cloudReady=false;cloudError=e.message;console.error('Cloud load:',e)}finally{cloudBusy=false;render()}
}
async function writeCloud(action,table,recordOrId){
 if(!cloudReady)throw Error('Облачная база ещё не подключена');
 return api(action,action==='save'?{table,record:recordOrId}:{table,id:recordOrId});
}
async function mutateCloud(work){
 if(cloudBusy)return;
 cloudBusy=true;cloudError='';render();
 try{await work();await loadCloud()}catch(e){cloudError=e.message;console.error('Cloud mutation:',e);await loadCloud();cloudError=e.message;render();alert('Не удалось сохранить в облако: '+e.message)}finally{cloudBusy=false;render()}
}

try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);if(valid(data))db=data;}}catch(e){storageOK=false;}
if(cloudMode)db=empty();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;}catch(e){storageOK=false;alert('Не удалось сохранить данные в браузере: '+e.message+'\nСкачай резервную копию в настройках.');}render();}
function subject(sid){return db.subjects.find(s=>s.id===sid)}
function btn(text,action,extra='',cls='secondary'){return `<button type="button" class="btn ${cls} ${extra}" data-action="${action}">${text}</button>`}
function render(){const tabs=[['subjects','📚','Предметы'],['calendar','📅','Календарь'],['grades','📊','Журнал'],['settings','⚙️','Настройки']];$('#nav').innerHTML=tabs.map(([key,emoji,label])=>`<button type="button" class="${tab===key?'active':''}" data-action="tab" data-tab="${key}"><span class="emoji">${emoji}</span>${label}</button>`).join('');$('#screen').innerHTML=(tab==='subjects'?renderSubjects():tab==='calendar'?renderCalendar():tab==='grades'?renderGrades():renderSettings())+(cloudMode?(cloudBusy?'<p class="notice">⏳ Синхронизация с облаком…</p>':cloudError?'<p class="notice">⚠️ '+escapeHTML(cloudError)+'</p>':cloudReady?'<p class="hint">☁️ Данные синхронизированы</p>':'<p class="notice">☁️ Подключи Supabase в настройках. Пока облако не подключено, изменения недоступны.</p>'):(!storageOK?'<p class="notice">⚠️ Браузер не разрешает сохранять данные.</p>':''));}
function renderSubjects(){let list=currentSubject?db.subjects.filter(s=>s.id===currentSubject):db.subjects;if(currentSubject&&!list.length){currentSubject=null;list=db.subjects;}return `<div class="top"><div><div class="eyebrow">${escapeHTML(db.semester)}</div><h1>${currentSubject?'Задания':'Моя учёба ✨'}</h1></div>${btn('+ Предмет','add-subject')}</div>${currentSubject?btn('← Все предметы','all-subjects','small'):''}${list.map(s=>{const tasks=db.tasks.filter(t=>t.sid===s.id).sort((a,b)=>a.due.localeCompare(b.due));return `<section class="card"><div class="row"><h2>${escapeHTML(s.name)}</h2>${btn('Изменить','edit-subject','small','secondary').replace('data-action','data-id="'+escapeHTML(s.id)+'" data-action')}</div>${tasks.map(t=>`<div class="item ${t.done?'done':''}"><div class="row"><input class="checkbox" type="checkbox" data-action="toggle-task" data-id="${escapeHTML(t.id)}" ${t.done?'checked':''} aria-label="Выполнено"><div class="grow"><strong class="task-name">${escapeHTML(t.name)}</strong><div class="muted">До ${prettyDate(t.due)}${t.description?' · '+escapeHTML(t.description):''}</div></div>${btn('✏️','edit-task','small').replace('data-action','data-id="'+escapeHTML(t.id)+'" data-action')}</div></div>`).join('')||'<p class="muted">Заданий пока нет</p>'}<div class="toolbar">${btn('+ Задание','add-task','small','').replace('data-action','data-sid="'+escapeHTML(s.id)+'" data-action')}</div></section>`}).join('')||'<div class="card empty">Добавь первый предмет 🌷</div>'}`}
function renderCalendar(){let y=month.getFullYear(),m=month.getMonth(),offset=(new Date(y,m,1).getDay()+6)%7,count=new Date(y,m+1,0).getDate();let cells=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="week">${x}</div>`).join('')+'<div></div>'.repeat(offset);for(let n=1;n<=count;n++){const date=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;cells+=`<button type="button" class="day ${selected===date?'active':''}" data-action="select-day" data-date="${date}">${n}${db.tasks.some(t=>t.due===date&&!t.done)?'<span class="dot"></span>':''}</button>`;}let tasks=db.tasks.filter(t=>t.due===selected),upcoming=db.tasks.filter(t=>!t.done).sort((a,b)=>a.due.localeCompare(b.due));return `<h1>Календарь 📅</h1><section class="card"><div class="row">${btn('‹','prev-month','small')}<strong>${escapeHTML(new Date(y,m,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'}))}</strong>${btn('›','next-month','small')}</div><div class="calendar" style="margin-top:12px">${cells}</div></section><section class="card"><h2>${prettyDate(selected)}</h2>${tasks.map(t=>`<div class="item">${t.done?'✅':'⏳'} ${escapeHTML(t.name)} <span class="muted">(${escapeHTML(subject(t.sid)?.name||'Удалённый предмет')})</span></div>`).join('')||'<p class="muted">Заданий на этот день нет</p>'}</section><section class="card"><h2>🔥 Ближайшие дедлайны</h2>${upcoming.slice(0,20).map(t=>`<div class="item"><strong>${escapeHTML(t.name)}</strong><div class="muted">${escapeHTML(subject(t.sid)?.name||'')} · ${prettyDate(t.due)}${t.due<today()?' · Просрочено':''}</div></div>`).join('')||'<p class="muted">Все задания выполнены!</p>'}</section>`}
function renderGrades(){return `<div class="top"><h1>Журнал 📊</h1>${btn('+ Оценка','add-grade','','')}</div>${db.subjects.map(s=>{const gs=db.grades.filter(g=>g.sid===s.id),sum=gs.reduce((n,g)=>n+Number(g.points),0);return `<section class="card"><div class="row"><h2>${escapeHTML(s.name)}</h2><span class="pill">${sum} баллов</span></div>${gs.map(g=>`<div class="item row"><span>${escapeHTML(g.name)} — <strong>${Number(g.points)}</strong></span>${btn('✏️','edit-grade','small').replace('data-action','data-id="'+escapeHTML(g.id)+'" data-action')}</div>`).join('')||'<p class="muted">Оценок пока нет</p>'}</section>`}).join('')||'<div class="card empty">Сначала добавь предмет</div>'}`}
function renderSettings(){return `<h1>Настройки ⚙️</h1>${cloudMode?`<section class="card"><h2>☁️ Облачное сохранение</h2><p class="muted">Вставь публичный URL функции study-api из Supabase. Токен бота сюда НЕ вводи.</p><label>Function URL<input id="cloud-url" type="url" value="${escapeHTML(cloudUrl)}" placeholder="https://PROJECT.supabase.co/functions/v1/study-api"></label><div class="toolbar" style="margin-top:12px">${btn('Подключить облако','connect-cloud','','')}${btn('Повторить загрузку','reload-cloud')}</div><p class="muted">${cloudReady?'🟢 Подключено':'⚪ Не подключено'}</p></section>`:''}<section class="card"><h2>🎨 Оформление</h2><p class="muted">Выбери любимую розовую тему. Выбор сохранится после перезагрузки.</p><div class="theme-options"><button type="button" class="theme-choice" data-action="theme" data-theme="light" aria-pressed="${theme==='light'}"><span class="preview"><span class="swatch" style="background:#fff5f9"></span><span class="swatch" style="background:#fff"></span><span class="swatch" style="background:#df5d99"></span></span><strong>🌸 Розово-белая</strong><small>${theme==='light'?'✓ Выбрана':'Светлая тема'}</small></button><button type="button" class="theme-choice" data-action="theme" data-theme="dark" aria-pressed="${theme==='dark'}"><span class="preview"><span class="swatch" style="background:#141016"></span><span class="swatch" style="background:#241b26"></span><span class="swatch" style="background:#ff75b4"></span></span><strong>🖤 Розово-чёрная</strong><small>${theme==='dark'?'✓ Выбрана':'Тёмная тема'}</small></button></div></section><section class="card"><h2>Текущий семестр</h2><p>${escapeHTML(db.semester)}</p>${btn('Начать новый семестр','new-semester','','')}</section><section class="card"><h2>Архив</h2>${db.archives.map((a,i)=>`<div class="item row"><span>${escapeHTML(a.semester)} · ${a.subjects.length} предм.</span><button type="button" class="btn secondary small" data-action="archive" data-index="${i}">Открыть</button></div>`).join('')||'<p class="muted">Архив пока пуст</p>'}</section><section class="card"><h2>Резервная копия</h2><p class="muted">${cloudMode?'Можно скачать резервную копию. Восстановление в облако пока недоступно.':'Локальные данные этого браузера. Сохраняй резервную копию.'}</p><div class="toolbar">${btn('Скачать копию','backup')}${cloudMode?'':btn('Восстановить','restore')}</div><input type="file" id="restore-file" accept=".json,application/json" hidden></section>`}
function openDialog(title,fields,kind,itemId='',sid=''){const modal=$('#modal');modal.hidden=false;modal.innerHTML=`<div class="dialog"><div class="row"><h2>${escapeHTML(title)}</h2>${btn('✕','close-dialog','small')}</div><form id="edit-form" class="stack" data-kind="${kind}" data-id="${escapeHTML(itemId)}" data-sid="${escapeHTML(sid)}">${fields}<button class="btn" type="submit">Сохранить</button></form>${itemId?`<div style="margin-top:12px">${btn('Удалить','delete-item','','danger').replace('data-action','data-kind="'+kind+'" data-id="'+escapeHTML(itemId)+'" data-action')}</div>`:''}</div>`;modal.querySelector('input,select,textarea')?.focus();}
function closeDialog(){$('#modal').hidden=true;$('#modal').innerHTML='';}
const input=(label,name,value='',type='text',required=true)=>`<label>${escapeHTML(label)}<input name="${name}" type="${type}" value="${escapeHTML(value)}" ${required?'required':''}></label>`;
function subjectDialog(s){openDialog(s?'Изменить предмет':'Новый предмет',input('Название предмета','name',s?.name||''),'subject',s?.id||'');}
function taskDialog(sid,t){openDialog(t?'Изменить задание':'Новое задание',input('Название задания','name',t?.name||'')+input('Сдать до','due',t?.due||today(),'date')+`<label>Описание<textarea name="description">${escapeHTML(t?.description||'')}</textarea></label>`,'task',t?.id||'',sid);}
function gradeDialog(g){if(!db.subjects.length)return alert('Сначала добавь предмет');const options=db.subjects.map(s=>`<option value="${escapeHTML(s.id)}" ${g?.sid===s.id?'selected':''}>${escapeHTML(s.name)}</option>`).join('');openDialog(g?'Изменить оценку':'Новая оценка',`<label>Предмет<select name="sid">${options}</select></label>`+input('За что оценка','name',g?.name||'')+input('Баллы','points',g?.points??'','number'),'grade',g?.id||'');}
async function saveForm(form){if(cloudBusy)return;
 const kind=form.dataset.kind,itemId=form.dataset.id,sid=form.dataset.sid;
 const v=Object.fromEntries(new FormData(form).entries());const name=(v.name||'').trim();
 if(!name)return alert('Введи название');
 if(kind==='task'&&!v.due)return alert('Выбери дату');
 if(kind==='grade'&&(v.points===''||!Number.isFinite(Number(v.points))))return alert('Укажи баллы');
 if(cloudMode){
  if(!cloudReady)return alert('Сначала подключи облако в настройках');
  let table,record;
  if(kind==='subject'){table='subjects';record={id:itemId||uuid(),semester_id:window.__semesterId,name};}
  else if(kind==='task'){table='tasks';const old=db.tasks.find(t=>t.id===itemId);record={id:itemId||uuid(),subject_id:sid,name,description:v.description||'',due_date:v.due,completed:old?.done||false};}
  else if(kind==='grade'){table='grades';record={id:itemId||uuid(),subject_id:v.sid,name,points:Number(v.points)};}
  closeDialog();await mutateCloud(()=>writeCloud('save',table,record));return;
 }
 if(kind==='subject'){const old=db.subjects.find(s=>s.id===itemId);if(old)old.name=name;else db.subjects.push({id:id(),name});}
 else if(kind==='task'){const old=db.tasks.find(t=>t.id===itemId);if(old)Object.assign(old,{name,due:v.due,description:v.description||''});else db.tasks.push({id:id(),sid,name,due:v.due,description:v.description||'',done:false});}
 else if(kind==='grade'){const points=Number(v.points);const old=db.grades.find(g=>g.id===itemId);if(old)Object.assign(old,{name,sid:v.sid,points});else db.grades.push({id:id(),sid:v.sid,name,points});}
 closeDialog();persist();
}
async function removeItem(kind,itemId){if(cloudBusy)return;if(!confirm('Удалить запись?'))return;
 if(cloudMode){if(!cloudReady)return alert('Сначала подключи облако');const table={subject:'subjects',task:'tasks',grade:'grades'}[kind];closeDialog();await mutateCloud(()=>writeCloud('delete',table,itemId));return;}
 if(kind==='subject'){db.subjects=db.subjects.filter(s=>s.id!==itemId);db.tasks=db.tasks.filter(t=>t.sid!==itemId);db.grades=db.grades.filter(g=>g.sid!==itemId);if(currentSubject===itemId)currentSubject=null;}
 else if(kind==='task')db.tasks=db.tasks.filter(t=>t.id!==itemId);else if(kind==='grade')db.grades=db.grades.filter(g=>g.id!==itemId);closeDialog();persist();}
async function newSemester(){if(cloudBusy)return;const name=prompt('Название нового семестра:',`Семестр ${db.archives.length+2}`);if(!name||!name.trim())return;
 if(!confirm('Старые задания и оценки уйдут в архив. Предметы останутся, баллы начнутся с нуля. Продолжить?'))return;
 if(cloudMode){if(!cloudReady)return alert('Сначала подключи облако');const previous=db.subjects.slice();await mutateCloud(async()=>{const semesterId=uuid();await writeCloud('save','semesters',{id:semesterId,name:name.trim()});for(const s of previous)await writeCloud('save','subjects',{id:uuid(),semester_id:semesterId,name:s.name});});currentSubject=null;return;}
 db.archives.push(clone({semester:db.semester,subjects:db.subjects,tasks:db.tasks,grades:db.grades}));db.semester=name.trim();db.tasks=[];db.grades=[];currentSubject=null;persist();}
function showArchive(index){const a=db.archives[index];if(!a)return;const modal=$('#modal');modal.hidden=false;modal.innerHTML=`<div class="dialog"><div class="row"><h2>${escapeHTML(a.semester)}</h2>${btn('✕','close-dialog','small')}</div>${a.subjects.map(s=>`<div class="item"><strong>${escapeHTML(s.name)}</strong><div class="muted">Баллов: ${a.grades.filter(g=>g.sid===s.id).reduce((n,g)=>n+Number(g.points),0)} · Заданий: ${a.tasks.filter(t=>t.sid===s.id).length}</div></div>`).join('')||'<p>Предметов нет</p>'}</div>`;}
function backup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='study-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
async function restore(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!valid(data))throw Error('Неверный формат');if(confirm('Заменить все текущие данные резервной копией?')){db=data;currentSubject=null;persist();}}catch(e){alert('Не удалось загрузить копию: '+e.message);}finally{$('#restore-file').value='';}}
document.addEventListener('submit',e=>{if(e.target.id==='edit-form'){e.preventDefault();saveForm(e.target).catch(err=>{alert('Ошибка сохранения: '+err.message);console.error(err)})}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.action==='toggle-task'){const t=db.tasks.find(t=>t.id===el.dataset.id);if(t){if(cloudMode){const record={id:t.id,subject_id:t.sid,name:t.name,description:t.description||'',due_date:t.due,completed:el.checked};mutateCloud(()=>writeCloud('save','tasks',record));}else{t.done=el.checked;persist();}}}if(el.id==='restore-file')restore(el.files[0]);});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.type==='checkbox')return;const a=el.dataset.action;try{if(a==='connect-cloud'){cloudUrl=normalizeURL($('#cloud-url').value);localStorage.setItem(CLOUD_URL_KEY,cloudUrl);loadCloud();}else if(a==='reload-cloud'){loadCloud();}else if(a==='theme'){setTheme(el.dataset.theme);}else if(a==='tab'){tab=el.dataset.tab;currentSubject=null;render();}else if(a==='add-subject')subjectDialog();else if(a==='edit-subject')subjectDialog(subject(el.dataset.id));else if(a==='all-subjects'){currentSubject=null;render();}else if(a==='add-task')taskDialog(el.dataset.sid);else if(a==='edit-task'){const t=db.tasks.find(t=>t.id===el.dataset.id);if(t)taskDialog(t.sid,t);}else if(a==='add-grade')gradeDialog();else if(a==='edit-grade')gradeDialog(db.grades.find(g=>g.id===el.dataset.id));else if(a==='close-dialog')closeDialog();else if(a==='delete-item')removeItem(el.dataset.kind,el.dataset.id);else if(a==='prev-month'||a==='next-month'){month=new Date(month.getFullYear(),month.getMonth()+(a==='next-month'?1:-1),1);render();}else if(a==='select-day'){selected=el.dataset.date;render();}else if(a==='new-semester')newSemester();else if(a==='archive')showArchive(Number(el.dataset.index));else if(a==='backup')backup();else if(a==='restore')$('#restore-file').click();}catch(err){console.error(err);alert('Ошибка: '+err.message);}});
render();
if(cloudMode){try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand();}catch(e){}if(cloudUrl)loadCloud();}
})();
</script></body></html>
